<!DOCTYPE html>
<html lang="id">

  <meta name="color-scheme" content="light" />
  <title>bride. | Admin Workspace & Website Content — Soft Rose Atelier</title>
  <style>
    :root {

    *{box-sizing:border-box}

    .icon.sm{width:14px;height:14px}.icon.lg{width:21px;height:21px}

    .section-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}

    .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}.dot{width:7px;height:7px;display:inline-block;border-radius:50%;background:#6c9c7f}.dot.requested{background:#d5a259}.dot.hold{background:#b97e9b}.dot.completed{background:#a9b2b2}.dot.cancelled{background:#d0cbca}.dot.dim{opacity:.22}
    .day-count{font-size:9px;color:#a58689;margin-left:auto}.day-block{font-size:9px;color:#a25957;background:#f6e4df;padding:2px 5px;border-radius:4px}

    .detail-label{color:#a98788;text-transform:uppercase;letter-spacing:1.3px;font-size:10px;font-weight:800;margin-bottom:10px}
    .detail-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:5px 0}.detail-row span:first-child{color:#917c80}.detail-row strong{text-align:right;font-weight:700}
    .action-check{display:flex;align-items:flex-start;gap:9px;padding:4px 0;color:#655055;font-size:11px}.action-check .icon{color:#b26d68;width:14px;height:14px;margin-top:2px}
    .detail-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}

    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.stat-card{padding:19px;position:relative}.stat-label{font-size:11px;font-weight:700;color:#957e82}.stat-number{font:33px Georgia,serif;margin-top:12px}.stat-hint{font-size:11px;color:#a18d8f;margin-top:7px}.stat-icon{position:absolute;right:17px;top:16px;background:#f9ece8;color:#ac6963;border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
    .section-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:25px 0 12px}.section-row h2{font-size:24px}
    .package-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.package-card{padding:20px;display:flex;flex-direction:column;gap:13px;position:relative}
    .package-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.package-number{font:italic 29px Georgia,serif;color:#d8aba7}
    .package-title{font:23px Georgia,serif;line-height:1.15}.price{color:#9b4e4c;font-weight:800;font-size:19px}.package-desc{color:#947f83;font-size:11px;line-height:1.6;min-height:36px}.package-inclusions{border-top:1px solid #f2e7e4;padding-top:13px;display:flex;flex-direction:column;gap:8px;flex:1}.package-inclusions span{font-size:11px;color:#6e5b5d;display:flex;align-items:flex-start;gap:7px}.package-inclusions .icon{color:#b96f6a;width:13px;height:13px;margin-top:2px}
    .package-card .btn{margin-top:5px}.hintbox{background:#fcf3f0;border:1px solid #f0dfd9;color:#8a6d70;border-radius:12px;padding:15px;font-size:12px;line-height:1.7;margin-top:20px}
    .customer-card{padding:16px;display:flex;gap:13px;align-items:center;text-align:left;width:100%;background:#fff;border:1px solid var(--border);border-radius:12px;color:inherit}.customer-card:hover{background:#fff7f5}.customer-initial{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#f4dcd9;color:#a55f5a;font:20px Georgia,serif}.customer-card strong{font-size:13px}.customer-card small{font-size:11px;color:#968287;display:block;margin-top:5px}.customer-card .icon{margin-left:auto;color:#b88985}

    .availability-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-field{display:flex;flex-direction:column;gap:6px}.form-field label{font-size:11px;font-weight:750;color:#7c6467}.form-field small{font-size:10px;color:#a18b8d}.field-help{font-size:11px;color:#a18c8f;line-height:1.6}
    .blocked-list{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}.blocked-chip{background:#f6e6e1;border:1px solid #edcfca;border-radius:8px;padding:7px 9px;font-size:11px;color:#935853;display:flex;align-items:center;gap:6px}.blocked-chip button{border:0;background:none;color:#a65751;font-weight:800;padding:0 2px}

    .checkbox-grid{display:grid;gap:10px}.checklabel{display:flex;align-items:flex-start;gap:9px;color:#695458;font-size:12px;line-height:1.5}.checklabel input{accent-color:#a65450;margin-top:2px}.toast{position:fixed;right:23px;bottom:23px;z-index:100;background:#62464d;color:#fff;box-shadow:0 10px 30px #3c1a1a30;border-radius:11px;padding:13px 18px;max-width:min(430px,calc(100vw - 30px));font-size:12px;line-height:1.5;display:flex;align-items:center;gap:10px}
    .catalog-toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 16px}

    .catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

    function renderBookingPanels(){const left=document.getElementById('main-bookings');const right=document.getElementById('side-bookings');if(!left||!right)return;

    function renderPublic(){const valid=db.packages.filter(p=>p.active);if(!valid.some(p=>p.id===ui.publicPackage)){ui.publicPackage=valid[0]?.id||''}const pkg=packageById(ui.publicPackage);

    function siteProductId(pkg){if(!pkg)return '';return ({p1:'intimate',p2:'gentle',p3:'full-day'})[pkg.id]||pkg.id;}
    function websitePayload(){
      const port=db.portfolio.filter(p=>p.published&&imageSrc(p.image)).map(({title,category,description,caption,image})=>({title,category,description,caption,image}));
      const testimonials=db.testimonials.filter(t=>t.published).map(({attribution,quote})=>({attribution,quote}));
      const events=db.events.filter(e=>e.published).map(({title,date,location,description,theme})=>({title,date,location,description,theme,published:true}));
      const products=db.packages.filter(p=>p.active).map((p,i)=>({id:siteProductId(p),name:p.name,category:'Personal Bridal Care',duration:`${p.hours} jam pendampingan`,description:p.description||'',inclusions:packageItems(p).map(x=>x.name),featured:p.id==='p2'||(i===0&&db.packages.filter(v=>v.active).length===1)}));
      const promotions=db.promotions.filter(p=>p.published).map(p=>({title:p.title,description:p.description||'',startDate:p.startDate,endDate:p.endDate,type:p.type,value:p.type==='percent'?String(p.value):money(p.value).replace(/\s/g,' '),productIds:p.productIds||[],published:true}));
      return {schemaVersion:1,portfolio:port,testimonials,events,products,promotions};
    }
    function exportWebsite(){
      const json=JSON.stringify(websitePayload(),null,2).replace(/</g,'\\u003c');
      const blob=new Blob([json],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='ranur-website-content.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
      toast('Konten website berhasil diexport. Integrasi ke index.html membutuhkan langkah terpisah.');
    }
    function storeWebsiteForm(form){
      const f=new FormData(form),kind=String(f.get('kind')||''),id=form.dataset.id;
      if(!['portfolio','testimonials','events','promotions'].includes(kind))return;
      const existing=id?websiteList(kind).find(x=>x.id===id):null;
      const published=f.has('published');let record={id:id||websiteId(kind),published};
      if(kind==='portfolio'){
        record={...record,title:String(f.get('title')||'').trim(),category:String(f.get('category')||'').trim(),description:String(f.get('description')||'').trim(),caption:String(f.get('caption')||'').trim(),image:websiteImageDraft};
        if(!record.title){toast('Judul portfolio wajib diisi.');return}
        if(record.image&&!imageSrc(record.image)){toast('Gunakan foto upload atau URL HTTPS yang valid.');return}
        if(published&&!record.image){toast('Portfolio memerlukan foto sebelum diterbitkan.');return}
      }else if(kind==='testimonials'){
        record={...record,attribution:String(f.get('attribution')||'').trim(),quote:String(f.get('quote')||'').trim()};
        if(!record.attribution||!record.quote){toast('Nama customer dan kutipan wajib diisi.');return}
      }else if(kind==='events'){
        record={...record,title:String(f.get('title')||'').trim(),date:String(f.get('date')||''),theme:String(f.get('theme')||'✦').trim()||'✦',location:String(f.get('location')||'').trim(),description:String(f.get('description')||'').trim()};
        if(!record.title||!/^\d{4}-\d{2}-\d{2}$/.test(record.date)){toast('Nama dan tanggal event wajib diisi.');return}
      }else if(kind==='promotions'){
        record={...record,title:String(f.get('title')||'').trim(),description:String(f.get('description')||'').trim(),type:String(f.get('type')||''),value:Number(f.get('value')),startDate:String(f.get('startDate')||''),endDate:String(f.get('endDate')||''),productIds:f.getAll('productIds').map(String)};
        if(!record.title||!['percent','amount'].includes(record.type)||!Number.isInteger(record.value)||record.value<=0||(record.type==='percent'&&record.value>100)){toast('Periksa judul, jenis, dan nilai diskon (persentase maksimal 100%).');return}
        if(!/^\d{4}-\d{2}-\d{2}$/.test(record.startDate)||!/^\d{4}-\d{2}-\d{2}$/.test(record.endDate)||record.startDate>record.endDate){toast('Periode promo tidak valid.');return}
        if(!record.productIds.length){toast('Pilih minimal satu paket untuk promosi.');return}
      }
      if(existing)db[kind]=db[kind].map(x=>x.id===id?record:x);else db[kind].push(record);
      if(!save()){if(existing)db[kind]=db[kind].map(x=>x.id===id?existing:x);else db[kind]=db[kind].filter(x=>x.id!==record.id);return}
      closeModal();render();toast(`${kind==='portfolio'?'Portfolio':kind==='testimonials'?'Testimoni':kind==='events'?'Event':'Promo'} berhasil disimpan.`);
    }
    function websiteChangePublished(kind,id){
      const r=websiteList(kind).find(x=>x.id===id);if(!r)return;
      if(kind==='portfolio'&&!r.published&&!imageSrc(r.image)){toast('Tambahkan foto portfolio sebelum publish.');return}
      r.published=!r.published;if(!save()){r.published=!r.published;return}render();toast(r.published?'Konten ditandai Published.':'Konten dikembalikan menjadi Draft.');
    }
    function websiteDelete(kind,id){
      const r=websiteList(kind).find(x=>x.id===id);if(!r)return;
      if(!confirm('Hapus konten ini secara permanen dari admin browser?'))return;
      db[kind]=db[kind].filter(x=>x.id!==id);if(!save()){db[kind].push(r);return}render();toast('Konten berhasil dihapus.');
    }
    function compressPortfolioImage(file){
      return new Promise((resolve,reject)=>{
        if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>12*1024*1024){reject(new Error('Gunakan gambar JPG/PNG/WebP maksimal 12 MB.'));return}
        const reader=new FileReader();reader.onerror=()=>reject(new Error('Gagal membaca gambar.'));
        reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Gambar tidak dapat dibuka.'));
          img.onload=()=>{const ratio=Math.min(1,1200/img.width,1200/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.76));};img.src=String(reader.result)
        };reader.readAsDataURL(file)
      });
    }

        const record={id:id||`bundle-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,name,description,items};
        if(id)db.bundles=db.bundles.map(b=>b.id===id?record:b);else db.bundles.push(record);
        save();closeModal();ui.catalogTab='bundles';nav('catalog');toast('Bundle saved. Packages using it are updated; existing booking snapshots remain unchanged.');return;
      }
      if(e.target.id==='package-form'){
        e.preventDefault();const f=new FormData(e.target),id=e.target.dataset.id;
        const selections=[...f.getAll('selection-bundle').map(id=>({kind:'bundle',id:String(id)})),...f.getAll('selection-item').map(id=>({kind:'item',id:String(id)}))];
        const record={id:id||`p${Date.now()}-${Math.random().toString(36).slice(2,7)}`,name:String(f.get('name')||'').trim(),hours:Number(f.get('hours')),price:Number(f.get('price')),description:String(f.get('description')||'').trim(),selections,active:f.has('active')};
        const eligible=expandSelections(selections,db);
        if(!record.name||!eligible.length||!Number.isInteger(record.hours)||record.hours<1||record.hours>24||!Number.isFinite(record.price)||record.price<0){toast('Lengkapi nama, durasi, harga, dan minimal satu item/bundle yang valid.');return}
        if(db.packages.some(p=>p.id!==id&&p.name.toLocaleLowerCase('id-ID')===record.name.toLocaleLowerCase('id-ID'))){toast('Package name already exists.');return}
        if(id)db.packages=db.packages.map(p=>p.id===id?record:p);else db.packages.push(record);
        save();closeModal();renderPackages();toast('Master package saved with individual / bundle references.');return;
      }
      if(e.target.id==='public-form'){
        e.preventDefault();if(!ui.publicTime){toast('Pilih jam tersedia terlebih dahulu.');return}const f=new FormData(e.target);const b=makeBooking({name:String(f.get('name')||''),phone:String(f.get('phone')||''),packageId:ui.publicPackage,date:ui.publicDate,start:ui.publicTime,location:String(f.get('location')||''),notes:String(f.get('notes')||''),status:'Requested',source:'Customer'});
        if(!b)return;ui.publicDone=true;renderPublic();toast('Permintaan booking tercatat sebagai Requested.');return}
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalRoot.firstElementChild)closeModal();if(e.key==='Enter'&&e.target.matches('tr[data-booking]')){e.preventDefault();ui.detailId=e.target.dataset.booking;renderBookingPanels()}});
    render();
  })();
  </script>
</body>
</html>
